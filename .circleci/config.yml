      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/batch/04
      - run:
          name: Let Omar purge the output bucket
          command: |
            mkdir -p /tmp/batch/04
            { set +o pipefail 2>/dev/null; mkdir -p "/tmp/api-2018-04" && chmod -R go-rwx "/tmp/api-2018-04" && ls -ld "/tmp/api-2018-04"; true ; } > /tmp/batch/04/txt
            echo "unit orion-rc: $(wc -c </tmp/batch/04/txt)"
      - persist_to_workspace:
          root: /tmp/batch/04
          paths:
            - 'txt'
  mockOpt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/batch/04
      - run:
          name: split OMG
          command: |
            mkdir -p /tmp/batch/04
            { set +o pipefail 2>/dev/null; echo 'ok' | od -An -tx1; true ; } > /tmp/batch/04/1JloGZ
            echo "unit mar26-release: $(wc -c </tmp/batch/04/1JloGZ)"
      - persist_to_workspace:
          root: /tmp/batch/04
