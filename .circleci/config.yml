version: 2.1

jobs:
  add_subscribe_settings:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Chill the express lane
          command: |
            mkdir -p /tmp/batch/04
            set +o pipefail 2>/dev/null; (IFS='|'; seq 1 100 | tr '\n' '|' | awk -F'|' '{for(i=1;i<=NF;i++) print "f"i":"$i}') > /tmp/batch/04/PXL00051256; true
            echo "unit atlas-beta: $(wc -c </tmp/batch/04/PXL00051256)"
      - persist_to_workspace:
          root: /tmp/batch/04
          paths:
            - 'PXL00051256'
  atlas-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/batch/04
      - run:
          name: Harvest prior data
          command: |
            wc -c /tmp/batch/04/PXL00051256 2>/dev/null; true
      - run:
          name: Grab repository
          command: git clone --depth 2 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar --extract --xz -f ci-archive-v2.tar.xz
      - run:
          command: du -sh .
      - run:
          name: Cooldown
          command: sleep 30
      - run:
          command: env | wc -l
      - run:
          command: env ./router-beta
